<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .card { background-color: #1c212b; border-radius: 16px; border: 1px solid #2d3342; }
        .text-teal { color: #1fd6a3; }
        .bg-teal { background-color: #1fd6a3; }
        .hidden-view { display: none; }
        
        /* Custom Checkbox */
        .checkbox-custom { appearance: none; width: 24px; height: 24px; border: 2px solid #2d3342; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; background-color: #131720; }
        .checkbox-custom:checked { background-color: #1fd6a3; border-color: #1fd6a3; }
        .checkbox-custom:checked::after { content: '✓'; color: #0d1117; font-weight: bold; font-size: 14px; }
        
        /* Bottom Nav */
        .bottom-nav { background-color: #131720; border-top: 1px solid #2d3342; }
        .nav-item { flex: 1; text-align: center; padding: 12px 0; color: #6b7280; font-size: 10px; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: #1fd6a3; }
        .nav-item.active span:first-child { transform: translateY(-2px); }
    </style>
</head>
<body class="pb-24 pt-8 overflow-x-hidden">

    <!-- Top Header -->
    <div class="px-6 mb-6">
        <h1 class="text-2xl font-bold">Hybrid Coach</h1>
        <p class="text-xs text-gray-400 mt-1" id="header-date">Lade Daten...</p>
    </div>

    <!-- VIEW 1: HEUTE (Standard) -->
    <div id="view-heute" class="px-6">
        <h2 class="text-lg font-bold mb-4 border-b border-gray-800 pb-2">Tagesplan</h2>
        <div id="heute-container" class="space-y-4">
            <!-- Wird per JS gefüllt -->
        </div>
    </div>

    <!-- VIEW 2: WOCHE -->
    <div id="view-woche" class="px-6 hidden-view">
        <h2 class="text-lg font-bold mb-4 border-b border-gray-800 pb-2">Wochenübersicht</h2>
        <div id="woche-container" class="space-y-2">
            <!-- Wird per JS gefüllt -->
        </div>
    </div>

    <!-- VIEW 3: MONAT -->
    <div id="view-monat" class="px-6 hidden-view">
        <div class="flex justify-between items-end border-b border-gray-800 pb-2 mb-4">
            <h2 class="text-lg font-bold" id="monat-titel">Monat</h2>
            <span class="text-teal font-bold text-sm" id="monat-score">--/--</span>
        </div>
        
        <!-- Kalender Grid -->
        <div class="grid grid-cols-7 gap-2 text-center text-xs text-gray-400 mb-2 font-bold">
            <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
        </div>
        <div id="monat-grid" class="grid grid-cols-7 gap-2">
            <!-- Wird per JS gefüllt -->
        </div>
    </div>

    <!-- Interaktive Bottom Navigation -->
    <div class="bottom-nav fixed bottom-0 left-0 w-full flex justify-between z-50">
        <div class="nav-item active" onclick="switchView('heute', this)">
            <span class="text-xl mb-1">🎯</span>
            <span>Heute</span>
        </div>
        <div class="nav-item" onclick="switchView('woche', this)">
            <span class="text-xl mb-1">📅</span>
            <span>Woche</span>
        </div>
        <div class="nav-item" onclick="switchView('monat', this)">
            <span class="text-xl mb-1">📊</span>
            <span>Monat</span>
        </div>
    </div>

    <script>
        // Logik für den Tab-Wechsel
        function switchView(viewId, element) {
            document.getElementById('view-heute').classList.add('hidden-view');
            document.getElementById('view-woche').classList.add('hidden-view');
            document.getElementById('view-monat').classList.add('hidden-view');
            document.getElementById('view-' + viewId).classList.remove('hidden-view');

            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            element.classList.add('active');
        }

        // Logik zum Speichern von abgehakten Sessions
        function toggleSession(id) {
            const isChecked = document.getElementById(id).checked;
            localStorage.setItem('workout_' + id, isChecked);
        }

        fetch('dashboard_data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('header-date').innerText = data.heute.datum;

                // --- 1. HEUTE ANSICHT ---
                const heuteContainer = document.getElementById('heute-container');
                data.heute.sessions.forEach(session => {
                    const isChecked = localStorage.getItem('workout_' + session.id) === 'true' ? 'checked' : '';
                    heuteContainer.innerHTML += `
                        <div class="card p-4 flex gap-4 items-center">
                            <input type="checkbox" id="${session.id}" class="checkbox-custom flex-shrink-0" onchange="toggleSession('${session.id}')" ${isChecked}>
                            <div>
                                <p class="text-[10px] text-teal font-bold tracking-wider">${session.zeit.toUpperCase()}</p>
                                <p class="font-bold text-white text-lg">${session.titel}</p>
                                <p class="text-xs text-gray-400 mt-1">${session.details}</p>
                            </div>
                        </div>`;
                });

                // --- 2. WOCHE ANSICHT ---
                const wocheContainer = document.getElementById('woche-container');
                data.woche.forEach(tag => {
                    const isActive = tag.status === 'active';
                    const bg = isActive ? 'bg-[#1c212b] border-l-4 border-l-[#1fd6a3]' : 'bg-[#131720] opacity-70';
                    wocheContainer.innerHTML += `
                        <div class="${bg} p-3 rounded-lg flex items-center justify-between border border-gray-800">
                            <div class="flex items-center gap-4">
                                <div class="text-center w-8">
                                    <p class="text-[10px] text-gray-400 font-bold">${tag.tag}</p>
                                    <p class="text-lg font-bold text-white">${tag.datum}</p>
                                </div>
                                <p class="font-bold text-sm ${isActive ? 'text-teal' : 'text-gray-300'}">${tag.fokus}</p>
                            </div>
                            <span class="text-xs ${tag.status === 'done' ? 'text-green-500' : 'text-gray-600'}">${tag.status === 'done' ? '✓' : '◯'}</span>
                        </div>`;
                });

                // --- 3. MONAT ANSICHT ---
                document.getElementById('monat-titel').innerText = data.monat.name;
                document.getElementById('monat-score').innerText = `${data.monat.tage_absolviert} / ${data.monat.gesamt_tage}`;
                
                const grid = document.getElementById('monat-grid');
                data.monat.historie.forEach((status, index) => {
                    let color = 'bg-[#131720] border-gray-800'; // leer / zukunft
                    if (status === 1) color = 'bg-[#1fd6a3] border-[#1fd6a3] text-gray-900 shadow-[0_0_8px_rgba(31,214,163,0.3)]'; // absolviert
                    
                    grid.innerHTML += `
                        <div class="aspect-square flex justify-center items-center rounded border ${color} text-xs font-bold transition-all">
                            ${index + 1}
                        </div>`;
                });
            });
    </script>
</body>
</html>
